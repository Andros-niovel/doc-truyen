<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Thư viện">
<title>Thư viện truyện</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#1d1d1f;--mut:#86868b;--card:#f2f2f4;--acc:#1f6f6b;--on:#fff;--bar:rgba(255,255,255,.93);--fs:19px;--lh:1.8;--ff:'Literata',Georgia,serif;--ui:'Be Vietnam Pro',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#14161c;--fg:#d9d6cc;--mut:#7d8088;--card:#1f222b;--acc:#e3b866;--on:#14161c;--bar:rgba(20,22,28,.93)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--fg:#d9d6cc;--mut:#7d8088;--card:#1f222b;--acc:#e3b866;--on:#14161c;--bar:rgba(20,22,28,.93)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--fg);font-family:var(--ui);overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.shelf{padding:28px 20px 40px;max-width:900px;margin:0 auto}
.hd2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{font:600 28px/1.2 var(--ff);margin:0 0 4px}.sub{color:var(--mut);font-size:14px;margin:0}
.imp{background:var(--acc);color:var(--on);font-weight:600;border-radius:12px;padding:10px 16px;font-size:14px;white-space:nowrap}
h2{font-size:15px;margin:0 0 12px;font-weight:600}
.cont{display:flex;gap:14px;align-items:center;width:100%;max-width:520px;text-align:left;background:var(--card);border-radius:18px;padding:12px;margin-bottom:26px}
.cont .cv{width:64px;flex:none;padding:0;border-radius:6px 10px 10px 6px}
.cont p{margin:0;font-size:13px;color:var(--mut)}.cont b{display:block;font:600 16px/1.3 var(--ff);color:var(--fg);margin:2px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.cv{position:relative;aspect-ratio:3/4;border-radius:6px 12px 12px 6px;padding:16px 12px 12px 22px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow:hidden;text-align:left;box-shadow:0 6px 16px rgba(0,0,0,.18);background:linear-gradient(155deg,hsl(var(--h) 45% 38%),hsl(calc(var(--h) + 40) 50% 18%));background-size:cover;background-position:center;transition:transform .2s}
.cv::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:rgba(0,0,0,.22)}.cv:active{transform:scale(.96) rotate(-1deg)}
.cv b{font:600 17px/1.25 var(--ff);text-shadow:0 1px 3px rgba(0,0,0,.5)}.cv i{font-size:12px;opacity:.8;font-style:normal}
.ring{position:absolute;top:10px;right:10px;width:34px;height:34px}.ring text{fill:#fff;font:600 9px var(--ui)}
.empty{text-align:center;color:var(--mut);padding:60px 10px;line-height:1.7}
.rd{position:fixed;inset:0;background:var(--bg);display:none}.rd.on{display:block}
#sc{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 84px) 24px calc(env(safe-area-inset-bottom,0px) + 150px)}
#sc article{max-width:680px;margin:0 auto;font:var(--fs)/var(--lh) var(--ff)}
article.fade{animation:fd .35s ease}@keyframes fd{from{opacity:0;transform:translateX(14px)}}
article h3{font:600 1.5em/1.3 var(--ff);margin:0 0 .4em}article small{color:var(--mut);font:13px var(--ui)}
.tx{white-space:pre-wrap;overflow-wrap:anywhere}.ci{display:block;max-width:100%;border-radius:10px;margin:0 0 1.2em}
.top,.bot{position:absolute;z-index:3;left:0;right:0;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .3s}
.top{top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
.top span{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}.top em{font-style:normal;color:var(--mut);font-size:12px}
.bot{bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 10px)}
.bot button{min-width:64px;height:50px;border-radius:14px;font-size:15px;font-weight:600}.bot button:active{background:var(--card)}.bot .on{color:var(--acc)}
.rd.hid .top{transform:translateY(-100%)}.rd.hid .bot{transform:translateY(100%)}
#pb{position:fixed;left:0;top:0;height:3px;background:var(--acc);width:0;z-index:5}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;z-index:8}.bd.on{opacity:1;pointer-events:auto}
.sh{position:fixed;left:50%;width:100%;max-width:560px;bottom:0;max-height:75%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:6px 20px calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:9}.sh.on{transform:translate(-50%,0)}
.hd{width:44px;height:5px;border-radius:3px;background:var(--mut);opacity:.5;margin:8px auto 14px;padding:10px 0;background-clip:content-box;touch-action:none}
.row{display:flex;gap:8px;margin:6px 0 18px}.row button{flex:1;padding:12px 4px;border-radius:12px;background:var(--card);font-size:14px}.row .sel{outline:2px solid var(--acc)}
label{font-size:13px;color:var(--mut);display:block}input[type=range]{width:100%;accent-color:var(--acc);margin:8px 0 18px}
.ch{display:flex;width:100%;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--card);text-align:left;font-size:15px}.ch.cur{color:var(--acc);font-weight:600}
.hb{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.imp2{border:2px solid var(--acc);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.bot .nv{min-width:46px;font-size:26px;line-height:1}
</style></head><body>
<div class="shelf" id="shelf"></div>
<div class="rd" id="rd"><div id="pb"></div>
<div class="top"><button id="bk">‹ Kệ</button><span id="tt"></span></div>
<div id="sc"><article id="ar"></article></div>
<div class="bot"><button id="pv" class="nv" aria-label="Chương trước">‹</button><button id="bc">≡ Chương</button><button id="bs">Aa</button><button id="bm">☆</button><button id="nx" class="nv" aria-label="Chương sau">›</button></div></div>
<div class="bd" id="bd"></div><div class="sh" id="sh"><div class="hd" id="hd"></div><div id="shc"></div></div>
<input type="file" id="fi" accept=".json,application/json" hidden>
<script>
const $=s=>document.querySelector(s),R=document.documentElement,esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let L={books:[]},cur,ci,S={pos:{},set:{size:19,lh:1.8,font:'serif',theme:''},mk:{},last:null};
try{Object.assign(S,JSON.parse(localStorage.getItem('tvr')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('tvr',JSON.stringify(S))}catch(e){}};
const db=()=>new Promise((ok,no)=>{const r=indexedDB.open('tvr',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const kv={get:k=>db().then(d=>new Promise(ok=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok()})).catch(()=>{}),
set:(k,v)=>db().then(d=>new Promise(ok=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok(1);t.onerror=()=>ok(0)})).catch(()=>0)};
const bk=id=>L.books.find(b=>b.id==id),prog=b=>{const p=S.pos[b.id];return p?Math.min(1,(p.c+(p.s||0))/b.c.length):0};
function apply(){const s=S.set;R.style.setProperty('--fs',s.size+'px');R.style.setProperty('--lh',s.lh);
R.style.setProperty('--ff',s.font=='sans'?"'Be Vietnam Pro',system-ui,sans-serif":"'Literata',Georgia,serif");
s.theme?R.dataset.theme=s.theme:delete R.dataset.theme;
const m=document.querySelector('meta[name=theme-color]')||document.head.appendChild(Object.assign(document.createElement('meta'),{name:'theme-color'}));m.content=getComputedStyle(document.body).backgroundColor}
function cover(b){const p=Math.round(prog(b)*100),C=87.96,im=b.img?`;background-image:linear-gradient(transparent 40%,rgba(0,0,0,.78)),url(${b.img})`:'';
return `<button class="cv" data-id="${b.id}" style="--h:${b.h||200}${im}"><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" fill="rgba(0,0,0,.35)" stroke="rgba(255,255,255,.3)" stroke-width="3"/><circle cx="18" cy="18" r="14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}" transform="rotate(-90 18 18)"/><text x="18" y="21" text-anchor="middle">${p}%</text></svg><b>${esc(b.t)}</b><i>${esc(b.a||'')}</i></button>`}
function shelf(){const l=S.last&&bk(S.last.id),p=l&&S.pos[l.id];
$('#shelf').innerHTML=`<div class="hd2"><div><h1>Thư viện của tôi</h1><p class="sub">${L.books.length} truyện</p></div><div class="hb">${(opener||location.protocol=='file:')?'<button class="imp2" id="ad">← Quản lý</button>':''}<button class="imp" id="im">Nhập truyện</button></div></div>`+
(L.books.length?((l&&p?`<h2>Đang đọc dở</h2><button class="cont" data-id="${l.id}"><div class="cv" style="--h:${l.h||200}${l.img?`;background-image:url(${l.img})`:''}"></div><div><p>Chương ${Math.min(p.c+1,l.c.length)}/${l.c.length}</p><b>${esc(l.t)}</b><p>${esc((l.c[Math.min(p.c,l.c.length-1)]||[''])[0])}</p></div></button>`:'')+`<h2>Tất cả truyện</h2><div class="grid">${L.books.map(cover).join('')}</div>`)
:'<div class="empty"><p>Chưa có truyện nào trong thư viện.</p><p>Bấm Nhập truyện rồi chọn file truyen.json từ trang quản lý. Truyện sẽ được lưu ngay trong máy này.</p></div>');
$('#im').onclick=()=>$('#fi').click();
if($('#ad'))$('#ad').onclick=()=>{try{if(opener&&!opener.closed){opener.focus();window.close();setTimeout(()=>alert('Hãy chuyển về tab quản lý (tab trước đó) để chỉnh sửa truyện.'),300);return}}catch(e){}location.href='quan-ly.html'};
document.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>{const id=e.dataset.id,p=S.pos[id]||{c:0,s:0};open(id,p.c,p.s)})}
function setLib(o){L=o;kv.set('lib',o);Object.keys(S.pos).forEach(k=>{if(!bk(k))delete S.pos[k]});sv();shelf()}
$('#fi').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!Array.isArray(o.books))throw 0;setLib(o)}catch(x){alert('File này không đúng định dạng truyen.json')}})};
if(opener)opener.postMessage({tvq:'ready'},'*');
addEventListener('message',e=>{const o=e.data&&e.data.lib;if(e.source!==opener||!o||!Array.isArray(o.books))return;if(confirm('Nhận '+o.books.length+' truyện từ trang quản lý? Thư viện hiện có trong trình duyệt này sẽ được thay bằng bản mới.'))setLib(o)});
function open(id,c,s){cur=bk(id);if(!cur||!cur.c.length)return;$('#rd').classList.add('on');$('#rd').classList.remove('hid');S.last={id};render(Math.min(c,cur.c.length-1),s)}
function render(c,s=0,anim){ci=c;const ch=cur.c[c],a=$('#ar');a.className='';void a.offsetWidth;if(anim)a.className='fade';
a.innerHTML=`<small>Chương ${c+1}/${cur.c.length}</small><h3>${esc(ch[0])}</h3>${ch[2]?`<img class="ci" src="${ch[2]}">`:''}<div class="tx"></div>`;a.querySelector('.tx').textContent=ch[1];
$('#tt').textContent=cur.t;$('#pv').style.opacity=c>0?1:.35;$('#nx').style.opacity=c<cur.c.length-1?1:.35;const k=cur.id+':'+c;$('#bm').textContent=S.mk[k]?'★':'☆';$('#bm').className=S.mk[k]?'on':'';
const sc=$('#sc');requestAnimationFrame(()=>{sc.scrollTop=s*(sc.scrollHeight-sc.clientHeight);upd()})}
function upd(){const sc=$('#sc'),m=sc.scrollHeight-sc.clientHeight,s=m>0?sc.scrollTop/m:1;$('#pb').style.width=s*100+'%';
S.pos[cur.id]={c:ci,s};sv()}
function go(d){const n=ci+d;if(n<0||n>=cur.c.length)returnrender(n,0,1)}
$('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);
$('#sc').onscroll=upd;$('#sc').onclick=e=>{const r=e.clientX/innerWidth;r<.2?go(-1):r>.8?go(1):$('#rd').classList.toggle('hid')};
$('#bk').onclick=()=>{$('#rd').classList.remove('on');shut();shelf()};
$('#bm').onclick=()=>{const k=cur.id+':'+ci;S.mk[k]?delete S.mk[k]:S.mk[k]=1;sv();$('#bm').textContent=S.mk[k]?'★':'☆';$('#bm').className=S.mk[k]?'on':''};
addEventListener('keydown',e=>{if(!$('#rd').classList.contains('on')||$('#sh').classList.contains('on'))return;e.key=='ArrowRight'?go(1):e.key=='ArrowLeft'?go(-1):e.key=='Escape'&&$('#bk').click()});
function sheet(h){$('#shc').innerHTML=h;$('#sh').classList.add('on');$('#bd').classList.add('on')}
function shut(){$('#sh').classList.remove('on');$('#bd').classList.remove('on')}
$('#bd').onclick=shut;let y0;$('#hd').ontouchstart=e=>y0=e.touches[0].clientY;$('#hd').ontouchend=e=>{if(e.changedTouches[0].clientY-y0>40)shut()};
$('#bc').onclick=()=>{sheet(cur.c.map((c,i)=>`<button class="ch ${i==ci?'cur':''}" data-i="${i}"><span>${i+1}. ${esc(c[0])}</span><span>${S.mk[cur.id+':'+i]?'★':''}</span></button>`).join(''));
document.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{shut();render(+b.dataset.i,0,1)})};
$('#bs').onclick=()=>{const s=S.set,on=(a,b)=>a==b?'sel':'';sheet(`<label>Cỡ chữ: <span id="v1">${s.size}</span></label><input type=range id="r1" min=15 max=28 value=${s.size}>
<label>Giãn dòng</label><input type=range id="r2" min=1.4 max=2.2 step=.1 value=${s.lh}>
<label>Font</label><div class="row" id="f"><button data-f="serif" class="${on(s.font,'serif')||(s.font!='sans'?'sel':'')}">Có chân</button><button data-f="sans" class="${on(s.font,'sans')}">Không chân</button></div>
<label>Nền</label><div class="row" id="t"><button data-t="" class="${on(s.theme,'')}">Tự động</button><button data-t="light" class="${on(s.theme,'light')}">Sáng</button><button data-t="dark" class="${on(s.theme,'dark')}">Tối</button></div>`);
$('#r1').oninput=e=>{s.size=+e.target.value;$('#v1').textContent=s.size;apply();sv()};$('#r2').oninput=e=>{s.lh=+e.target.value;apply();sv()};
document.querySelectorAll('#f button').forEach(b=>b.onclick=()=>{s.font=b.dataset.f;apply();sv();$('#bs').click()});
document.querySelectorAll('#t button').forEach(b=>b.onclick=()=>{s.theme=b.dataset.t;apply();sv();$('#bs').click()})};
matchMedia('(prefers-color-scheme:dark)').addEventListener&&matchMedia('(prefers-color-scheme:dark)').addEventListener('change',apply);
apply();shelf();kv.get('lib').then(v=>{if(v&&Array.isArray(v.books)){L=v;shelf()}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
